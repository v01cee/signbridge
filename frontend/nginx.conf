server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Digital Asset Links — для убирания Chrome URL-бара в TWA
    location /.well-known/assetlinks.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    # APK раздаём с правильным mime-типом
    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment';
    }

    # Service Worker — не кэшировать
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # API proxy
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads (медиа жестов)
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
